version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    container_name: heidelai-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - ./config/vault-standalone.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_API_ADDR=http://127.0.0.1:8200

volumes:
  vault_data:
    name: heidelai_vault_data
